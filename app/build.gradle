plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
}

if (project.hasProperty("Mobile_Project.signing")
        && new File(project.property("Mobile_Project.signing") + ".gradle").exists()) {
    apply from: project.property("Mobile_Project.signing") + ".gradle"
}

android {
    namespace "org.elbe.relations.mobile"
    compileSdk 36
    defaultConfig {
        applicationId "org.elbe.relations.mobile"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        // BuildConfig.VERSION_CODE is used by the release notes test
        buildConfig true
    }
    packaging {
        resources {
            // duplicates in the Netty jars used by jvm-libp2p
            excludes += ['META-INF/io.netty.versions.properties',
                         'META-INF/INDEX.LIST',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                         'META-INF/license/*',
                         'META-INF/native-image/**']
        }
    }
    lint {
        // Java 21 library APIs (e.g. List.removeFirst()) are missing below API 35
        error 'NewApi'
    }
}

kotlin {
    jvmToolchain(21)
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // Cloud providers
    implementation libs.dropbox.core.sdk
    implementation libs.azure.storage.android
    // Peer-to-peer (jvm-libp2p), without the desktop-only Netty natives
    implementation(libs.jvm.libp2p) {
        exclude group: 'io.netty', module: 'netty-codec-native-quic'
        exclude group: 'io.netty', module: 'netty-tcnative-boringssl-static'
        exclude group: 'io.netty', module: 'netty-transport-classes-epoll'
    }
    // Lucene
    //noinspection GradleDependency
    implementation libs.lucene.core
    //noinspection GradleDependency
    implementation libs.lucene.analyzers.common
    //noinspection GradleDependency
    implementation libs.lucene.queryparser
    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    androidTestImplementation libs.androidx.room.testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.kotlinx.coroutines.test
    // org.json is stubbed in android.jar
    testImplementation libs.org.json
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
