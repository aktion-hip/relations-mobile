pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // resolves the JDK 21 toolchain automatically if none is installed
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // jvm-libp2p and its transitive dependencies, restricted to their groups
        maven {
            url 'https://dl.cloudsmith.io/public/libp2p/jvm-libp2p/maven/'
            content { includeGroup 'io.libp2p' }
        }
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.multiformats' }
        }
        maven {
            url 'https://artifacts.consensys.net/public/maven/maven/'
            content { includeGroup 'tech.pegasys' }
        }
    }
}

rootProject.name = 'relations-mobile'
include ':app'
